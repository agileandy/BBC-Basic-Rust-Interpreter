[package]
name = "bbc-basic-interpreter"
version = "0.1.0"
edition = "2021"

[dependencies]
# For random number generation (RND function)
rand = "0.8"
# For raw terminal mode, so that GET reads one key with no Return key
crossterm = { version = "0.29", default-features = false, features = ["windows"] }

[dev-dependencies]
# For property-based testing
quickcheck = "1.0"
quickcheck_macros = "1.0"
