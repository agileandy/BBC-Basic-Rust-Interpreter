[package]
name = "bbc-basic-interpreter"
version = "0.1.0"
edition = "2021"

[dependencies]
# For random number generation (RND function)
rand = "0.8"
# For raw terminal mode, so that GET reads one key with no Return key
crossterm = { version = "0.29", default-features = false, features = ["windows", "events"] }
# For the full-screen IDE (--ide): it draws only the cells that changed, and
# its test backend lets a test read the screen with no real terminal
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
# For the JSON extension functions LOADJSON$, SAVEJSON and JSONVALID
# preserve_order keeps the keys of an object in the order of the text
serde_json = { version = "1.0", features = ["preserve_order"] }
# For the maps of the collections extension: the keys stay in the order of the puts
indexmap = "2"
# For the SOUND statement: it plays the samples of the sound chip model on the
# default audio output (CoreAudio on macOS, ALSA on Linux, WASAPI on Windows)
cpal = "0.18"

[target.'cfg(unix)'.dependencies]
# For poll and non-blocking stdin, so that INKEY waits for a key a maximum time
libc = "0.2"

[dev-dependencies]
# For property-based testing
quickcheck = "1.0"
quickcheck_macros = "1.0"
